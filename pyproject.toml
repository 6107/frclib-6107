#
# NOTE: The first part of the version number is the year of the FIRST Robotics Competition season.
#       that the library is intended to be used for.
#
[project]
name = "lib_6107"
version = "2027.0.0.1"
requires-python = ">=3.14"
#
description = "Python helper library focused on the CyberJagzz FRC Team 6107 robot requirements"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["FRC", "robot", "robotpy", "FIRST", "Jemison", "CyberJagzz", "6107"]
authors = [
  {name = "Chip Boling", email = "chip@bcsw.net"}
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3.14",
]
# Core dependencies installed via pip
dependencies = [
    "wpilib                  >= 2027.0.0a8",
    "robotpy                 >= 2027.0.0a8",
    "robotpy-hal             >= 2027.0.0a8",
    "robotpy-apriltag        >= 2027.0.0a8",
    "robotpy-fields          >= 2027.0.0a8",
    "robotpy-navx            >= 2027.0.0a1",
    "robotpy-commands-v2     >= 2027.0.0a8",
    "robotpy-cli             >= 2027.0.1b2",
    "robotpy-rev             >= 2027.0.0a8",
    "robotpy-cscore          >= 2027.0.0a8",
    "pyntcore                >= 2027.0.0a8",
    "phoenix6                >= 26.70.0a2",
    "photonlibpy             >= 2026.3.4",
    "limelightlib-python     >= 0.9.6",
    "opencv-python           == 5.1.0.95",
    "cpy6107                 >= 2027.0.0a8.post14",
    "pathplannerlib          >= 2027.0.0.0a8",
]

[build-system]
# Specifies the tools needed to build the package
#requires = ["hatchling"]
#build-backend = "hatchling.build"
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

# Enable uv to manage this project
[tool.uv]
managed = true
package = true
# robotpy 2027 is only published as alpha/pre-releases currently
prerelease = "allow"
no-build-isolation-package = ["cpy6107"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "uv          >= 0.13.6",
    "cmake       >= 3.28",
    "nanobind    >= 2.4.0",
    "scikit-build-core >= 0.10.0",
    "pytest      >= 9.0.3",
    "pytest-cov  >= 6.0.0",
    "pylint      >= 4.0.5",
    "bandit      >= 1.9.4",
    "tox-uv      >= 1.37.3",
    "pip-licenses>= 5.5.5",
    "pip-audit   >= 2.10.1",
    "ruff        >= 0.15.16",
    "ty          >= 0.0.48",
    "coverage    >= 7.14.1",
    "commitizen  >= 3.0.2",
    "pre-commit  >= 4.7.0",
    "pathplannerlib >= 2027.0.0.0a8",
]

[tool.uv.sources]
pathplannerlib = { path = "../pathplanner/pathplannerlib-python", editable = true }

[project.urls]
Homepage = "https://cyberjagzz.org"
Source = "https://github.com/6107/frclib-6107"
Documentation = "https://github.com/6107/frclib-6107/tree/main/docs"
Changelog = "https://github.com/6107/frclib-6107/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
# Configuration for development tools like pytest
testpaths = ["tests", "test/commands", "test/pykit", "test/subsystems", "tests/util"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [
    "dist",
    "build",
    ".venv",
    ".venv-dev",
    "*.egg-info",
    "tests",
    "example",
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort (import ordering)
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length is enforced by the formatter/line-length setting instead
    "UP046"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.commitizen]
name = "cz_conventional_commits"
version = "2027.0.0.1"
tag_format = "v$version"
version_files = [
    "pyproject.toml:^version",
    "src/lib_6107/__init__.py:^__version__"
]
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
